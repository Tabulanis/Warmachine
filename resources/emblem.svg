<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3ccd9"/><stop offset="0.5" stop-color="#7d8798"/><stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1f"/><stop offset="0.5" stop-color="#ffb347"/><stop offset="1" stop-color="#fff1c4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- heater shield, split by the slash: the right half sits a touch lower -->
  <g id="shield">
    <clipPath id="left"><polygon points="0,0 700,0 300,1024 0,1024"/></clipPath>
    <clipPath id="right"><polygon points="700,0 1024,0 1024,1024 300,1024"/></clipPath>
    <g clip-path="url(#left)">
      <path d="M512 150 L800 230 C800 520 700 740 512 880 C324 740 224 520 224 230 Z" fill="url(#steel)" stroke="#1d2129" stroke-width="18"/>
      <path d="M512 215 L735 275 C735 500 655 680 512 800 C369 680 289 500 289 275 Z" fill="none" stroke="#2a2f3a" stroke-width="14"/>
    </g>
    <g clip-path="url(#right)" transform="translate(26 34)">
      <path d="M512 150 L800 230 C800 520 700 740 512 880 C324 740 224 520 224 230 Z" fill="url(#steel)" stroke="#1d2129" stroke-width="18"/>
      <path d="M512 215 L735 275 C735 500 655 680 512 800 C369 680 289 500 289 275 Z" fill="none" stroke="#2a2f3a" stroke-width="14"/>
    </g>
  </g>
  <!-- the slash -->
  <g filter="url(#glow)">
    <line x1="765" y1="95" x2="265" y2="930" stroke="url(#ember)" stroke-width="34" stroke-linecap="round"/>
    <line x1="765" y1="95" x2="265" y2="930" stroke="#fff6e0" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
